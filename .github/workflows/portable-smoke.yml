name: Prepared app64 VBoxManage smoke (diagnostic only)

on:
  push:
    branches: [dev/modernization-2026]
    paths:
      - .github/workflows/portable-smoke.yml
      - scripts/vbox_cli_probe.ps1
      - tests/test_cli_probe_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app64-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-cli:
    if: github.repository == 'zlocorp/Portable-VirtualBox'
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check fixed-command smoke contract
        shell: pwsh
        run: |
          python -X utf8 -m unittest tests.test_cli_probe_contract -v
          if ($LASTEXITCODE -ne 0) { throw 'CLI safety contract failed' }
      - name: Verify Oracle 7.2.22 wrapper and read MSI metadata
        shell: pwsh
        run: ./scripts/inspect_oracle.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'portable-smoke-packages')
      - name: Prepare app64 with no MSI execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'portable-smoke-packages'
          $exe = Join-Path $work 'VirtualBox-7.2.22-175245-Win.exe'
          $app = Join-Path $work 'portable Тест\app64'
          New-Item -ItemType Directory -Path (Split-Path $app -Parent) | Out-Null
          python -X utf8 scripts/prepare_app64.py $exe $app --sha256 afd0ff1656cbe04ed88ce619594ae021419d97cce89fa9bdc443e9a963f1713f --version 7.2.22
          if ($LASTEXITCODE -ne 0) { throw 'Passive app64 preparation failed' }
          $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $app 'VirtualBox.exe')
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Oracle') { throw 'Prepared Oracle runtime signature is invalid' }
          "PREPARED_APP64=$app" >> $env:GITHUB_ENV
      - name: Execute bounded VBoxManage read-only commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'vbox-cli-observation'
          ./scripts/vbox_cli_probe.ps1 -AppDir $env:PREPARED_APP64 -OutputDirectory $out -TimeoutSeconds 25
      - name: Collect only diagnostic logs (never Oracle binaries or VM data)
        if: always()
        shell: pwsh
        run: |
          $origin = Join-Path $env:RUNNER_TEMP 'vbox-cli-observation'
          if (Test-Path (Join-Path $origin 'probe-results.json')) {
            $target = 'results/portable-cli'
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -LiteralPath (Join-Path $origin 'probe-results.json') -Destination $target
            Get-ChildItem -LiteralPath $origin -File | Where-Object { $_.Name -match '^(version|list_vms|system_properties)\.(stdout|stderr)\.txt$' } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $target }
          }
      - name: Publish experiment evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: VBoxManage-portable-cli-diagnostic
          path: results/portable-cli/
          if-no-files-found: warn
          retention-days: 7
