name: Standalone VBoxSup signed INF investigation (disposable)

on:
  push:
    branches: [dev/modernization-2026]
    paths:
      - .github/workflows/sup-standalone.yml
      - scripts/vbox_sup_standalone.ps1
      - tests/test_sup_standalone_contract.py
      - scripts/vbox_sup_start_owned.ps1
      - tests/test_sup_start_contract.py
      - scripts/vbox_vm_boot_probe.ps1
      - tests/test_vm_boot_standalone_contract.py
      - scripts/vbox_sup_cleanup.ps1
      - tests/test_sup_cleanup_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-sup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-and-probe:
    if: github.repository == 'zlocorp/Portable-VirtualBox'
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check standalone INF experiment contract
        shell: pwsh
        run: |
          python -X utf8 -m unittest tests.test_sup_standalone_contract -v
          if ($LASTEXITCODE -ne 0) { throw 'Standalone driver experiment contract failed' }
      - name: Verify official Oracle 7.2.20 installer and inspect MSI
        shell: pwsh
        run: ./scripts/inspect_oracle.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'standalone-sup-package')
      - name: Prepare app64 without running Oracle MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'standalone-sup-package'
          $exe = Join-Path $work 'VirtualBox-7.2.20-175154-Win.exe'
          $app = Join-Path $work 'portable VBox Тест\app64'
          New-Item -ItemType Directory -Path (Split-Path $app -Parent) | Out-Null
          python -X utf8 scripts/prepare_app64.py $exe $app --sha256 a81777d2b36380ce042a29e9c554cf032eb46a793f62e3cc82e7411e535c2c26 --version 7.2.20
          if ($LASTEXITCODE -ne 0) { throw 'File-only app64 preparation failed' }
          "STANDALONE_APP64=$app" >> $env:GITHUB_ENV
      - name: Stage signed VBoxSup INF with pnputil on isolated Windows
        shell: pwsh
        run: |
          ./scripts/vbox_sup_standalone.ps1 -AppDir $env:STANDALONE_APP64 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'standalone-sup-report') -TimeoutSeconds 75
      - name: Start only signed owned VBoxSup on disposable runner
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'standalone-sup-report\sup-standalone.json'
          $destination = Join-Path $env:RUNNER_TEMP 'owned-sup-start-result'
          ./scripts/vbox_sup_start_owned.ps1 -StandaloneReport $source -OutputDirectory $destination -TimeoutSeconds 30
      - name: Attempt blank VM start from portable app64 and standalone VBoxSup
        shell: pwsh
        run: |
          $sup = Join-Path $env:RUNNER_TEMP 'standalone-sup-report\sup-standalone.json'
          $report = Get-Content -LiteralPath $sup -Raw | ConvertFrom-Json
          $started = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'owned-sup-start-result\sup-start-results.json') -Raw | ConvertFrom-Json
          if ($report.pnputil_exit_code -ne 0 -or -not $report.service_registered -or -not $report.system_driver_matches_package -or
              -not $started.driver_running) {
            Write-Host 'Standalone VBoxSup is not running; VM start skipped with recorded installation/start evidence.'
            exit 0
          }
          ./scripts/vbox_vm_boot_probe.ps1 -AppDir $env:STANDALONE_APP64 -StandaloneDriverReport $sup -OutputDirectory (Join-Path $env:RUNNER_TEMP 'standalone-vm-boot') -TimeoutSeconds 35
      - name: Release only owned VBoxSDS and VBoxSup after confirmed private VM poweroff
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'standalone-sup-report\sup-standalone.json'
          $started = Join-Path $env:RUNNER_TEMP 'owned-sup-start-result\sup-start-results.json'
          $boot = Join-Path $env:RUNNER_TEMP 'standalone-vm-boot\vm-boot-results.json'
          if (-not (Test-Path -LiteralPath $stage) -or -not (Test-Path -LiteralPath $started) -or -not (Test-Path -LiteralPath $boot)) {
            Write-Host 'No complete standalone-driver VM boot experiment: teardown remains untested on this runner'
            exit 0
          }
          $source = Get-Content -LiteralPath $stage -Raw | ConvertFrom-Json
          $state = Get-Content -LiteralPath $started -Raw | ConvertFrom-Json
          $vm = Get-Content -LiteralPath $boot -Raw | ConvertFrom-Json
          if (-not $source.service_registered -or -not $state.driver_running -or -not $vm.startvm_returned_zero -or -not $vm.poweroff_succeeded) {
            Write-Host 'Signed driver boot was not fully confirmed: no speculative cleanup is attempted'
            exit 0
          }
          ./scripts/vbox_sup_cleanup.ps1 -AppDir $env:STANDALONE_APP64 -StandaloneReport $stage -DriverStartReport $started -BootReport $boot -OutputDirectory (Join-Path $env:RUNNER_TEMP 'owned-sup-cleanup') -TimeoutSeconds 45
      - name: Collect probe evidence only
        if: always()
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'standalone-sup-report'
          if (Test-Path -LiteralPath $src) {
            $dest = 'results/standalone-sup'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Get-ChildItem -LiteralPath $src -File |
              Where-Object { $_.Name -in @('sup-standalone.json','pnputil.stdout.txt','pnputil.stderr.txt') } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dest }
          }
          $start = Join-Path $env:RUNNER_TEMP 'owned-sup-start-result'
          if (Test-Path -LiteralPath $start) {
            $dest = 'results/standalone-sup'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Get-ChildItem -LiteralPath $start -File |
              Where-Object { $_.Name -in @('sup-start-results.json','driver-start.stdout.txt','driver-start.stderr.txt') } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dest }
          }
          $boot = Join-Path $env:RUNNER_TEMP 'standalone-vm-boot'
          if (Test-Path -LiteralPath $boot) {
            $dest = 'results/standalone-sup'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Get-ChildItem -LiteralPath $boot -File |
              Where-Object { $_.Name -in @('vm-boot-results.json','hardening-tail.txt') -or $_.Name -match '^(set_machine_folder|create_fixture|configure_fixture|list_fixture|inspect_fixture|start_headless|show_state|poweroff_fixture)\.(stdout|stderr)\.txt$' } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dest }
          }
          $cleanup = Join-Path $env:RUNNER_TEMP 'owned-sup-cleanup'
          if (Test-Path -LiteralPath $cleanup) {
            $dest = 'results/standalone-sup'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Get-ChildItem -LiteralPath $cleanup -File |
              Where-Object { $_.Name -in @('cleanup-results.json','sds-unregister.stdout.txt','sds-unregister.stderr.txt','sup-stop.stdout.txt','sup-stop.stderr.txt','sup-package-remove.stdout.txt','sup-package-remove.stderr.txt') } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dest }
          }
      - name: Publish metadata only (no Oracle binaries/drivers)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: standalone-VBoxSup-INF-diagnostic
          path: results/standalone-sup/
          if-no-files-found: warn
          retention-days: 7
