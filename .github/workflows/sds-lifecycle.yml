name: Disposable VBoxSDS auto-registration lifecycle
# Bounded hosted-host verification of Oracle --unregservice; never on a user's PC.

on:
  push:
    branches: [dev/modernization-2026]
    paths:
      - .github/workflows/sds-lifecycle.yml
      - scripts/vbox_sds_lifecycle.ps1
      - tests/test_sds_lifecycle_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sds-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe-and-unregister:
    if: github.repository == 'zlocorp/Portable-VirtualBox'
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Enforce disposable-host service research contract
        shell: pwsh
        run: |
          python -X utf8 -m unittest tests.test_sds_lifecycle_contract -v
          if ($LASTEXITCODE -ne 0) { throw 'VBoxSDS experiment safety contract failed' }
      - name: Verify signed Oracle 7.2.22 wrapper and MSI
        shell: pwsh
        run: ./scripts/inspect_oracle.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'sds-verified-packages')
      - name: Prepare app64 without running installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'sds-verified-packages'
          $exe = Join-Path $work 'VirtualBox-7.2.22-175245-Win.exe'
          $app = Join-Path $work 'portable Тест\app64'
          New-Item -ItemType Directory -Path (Split-Path $app -Parent) | Out-Null
          python -X utf8 scripts/prepare_app64.py $exe $app --sha256 afd0ff1656cbe04ed88ce619594ae021419d97cce89fa9bdc443e9a963f1713f --version 7.2.22
          if ($LASTEXITCODE -ne 0) { throw 'File-only preparation failed' }
          "PREPARED_SDS_APP=$app" >> $env:GITHUB_ENV
      - name: Observe VBoxSDS creation and conditionally unregister owned service
        shell: pwsh
        run: |
          ./scripts/vbox_sds_lifecycle.ps1 -AppDir $env:PREPARED_SDS_APP -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sds-lifecycle-results') -IdleSeconds 30 -CommandSeconds 20
      - name: Collect metadata and command output only
        if: always()
        shell: pwsh
        run: |
          $origin = Join-Path $env:RUNNER_TEMP 'sds-lifecycle-results'
          if (Test-Path -LiteralPath $origin) {
            $target = 'results/sds-lifecycle'
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Get-ChildItem -LiteralPath $origin -File |
              Where-Object { $_.Name -eq 'sds-lifecycle.json' -or $_.Name -match '^(version|list_vms|system_properties|unregister_owned_sds)\.(stdout|stderr)\.txt$' } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $target }
          }
      - name: Publish bounded diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: disposable-VBoxSDS-lifecycle
          path: results/sds-lifecycle/
          if-no-files-found: warn
          retention-days: 7
