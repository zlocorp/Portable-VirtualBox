name: Complete portable root relocation (disposable, no guest boot)

on:
  push:
    branches: [dev/modernization-2026]
    paths:
      - .github/workflows/portable-relocation.yml
      - scripts/vbox_root_relocation_probe.ps1
      - tests/test_relocation_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relocation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relocate-root:
    if: github.repository == 'zlocorp/Portable-VirtualBox'
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        relocation_mode: [directory, drive-alias]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify contract and PowerShell syntax before any Oracle invocation
        shell: pwsh
        run: |
          python -X utf8 -m unittest tests.test_relocation_contract -v
          if ($LASTEXITCODE -ne 0) { throw 'Relocation contract failed' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts\vbox_root_relocation_probe.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Relocation script syntax invalid: ' + ($errors -join '; ')) }
      - name: Verify official Oracle wrapper and extract MSI without installation
        shell: pwsh
        run: |
          ./scripts/inspect_oracle.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'portable-relocation-oracle')
      - name: Prepare trusted signed app64 under old portable root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'Portable USB Исходник Тест'
          New-Item -ItemType Directory -Path $source -ErrorAction Stop | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP 'portable-relocation-oracle\VirtualBox-7.2.20-175154-Win.exe'
          $app = Join-Path $source 'app64'
          python -X utf8 scripts/prepare_app64.py $installer $app --sha256 a81777d2b36380ce042a29e9c554cf032eb46a793f62e3cc82e7411e535c2c26 --version 7.2.20
          if ($LASTEXITCODE -ne 0) { throw 'Portable app64 preparation failed' }
          "ORIGINAL_PORTABLE_ROOT=$source" >> $env:GITHUB_ENV
      - name: Move full root with same VM UUID and disk file, then clean owned VBoxSDS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $switches = @{}
          if ('${{ matrix.relocation_mode }}' -eq 'drive-alias') { $switches['SimulateDriveLetterChange'] = $true }
          ./scripts/vbox_root_relocation_probe.ps1 -PortableRoot $env:ORIGINAL_PORTABLE_ROOT -DestinationRoot (Join-Path $env:RUNNER_TEMP 'Portable USB Перенесено Тест') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'portable-relocation-evidence') -TimeoutSeconds 30 @switches
      - name: Publish only bounded diagnostic report and CLI logs
        if: always()
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'portable-relocation-evidence'
          if (Test-Path (Join-Path $source 'relocation-results.json')) {
            $destination = 'results/portable-relocation'
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item -LiteralPath (Join-Path $source 'relocation-results.json') -Destination $destination
            Get-ChildItem -LiteralPath $source -File |
              Where-Object { $_.Name -match '^(old_|new_)[a-z_0-9\-]+\.(stdout|stderr)\.txt$' } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $destination }
          }
      - name: Upload research metadata only (no VM, VDI or Oracle binaries)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: portable-root-relocation-${{ matrix.relocation_mode }}
          path: results/portable-relocation/
          if-no-files-found: warn
          retention-days: 7
