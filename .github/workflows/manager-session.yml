name: Main launcher Manager GUI runtime (disposable Windows only)

on:
  push:
    branches: [dev/modernization-2026]
    paths:
      - .github/workflows/manager-session.yml
      - source/LauncherGui.au3
      - source/LauncherI18n.au3
      - source/Portable-VirtualBox.au3
      - tests/test_main_manager_wiring.py
      - source/ManagedProcess.au3
      - source/ManagerSession.au3
      - source/ManagerWindow.au3
      - source/Portable-VirtualBox-Session-Test.au3
      - scripts/manager_session_worker.ps1
      - scripts/check_manager_session_gui.ps1
      - scripts/snapshot_manager_windows.ps1
      - scripts/vbox_sup_cleanup.ps1
      - scripts/build.ps1
      - tests/test_manager_session_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-manager-session-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-launcher-manager:
    if: github.repository == 'zlocorp/Portable-VirtualBox'
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Source contracts and PowerShell syntax
        shell: pwsh
        run: |
          python -X utf8 -m unittest tests.test_main_manager_wiring tests.test_manager_session_contract tests.test_sup_cleanup_contract -v
          if ($LASTEXITCODE -ne 0) { throw 'Manager contracts failed' }
          foreach ($file in @('scripts/manager_session_worker.ps1','scripts/check_manager_session_gui.ps1','scripts/vbox_sup_cleanup.ps1')) {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell syntax $file : " + ($errors -join '; ')) }
          }
      - name: Verify pinned Oracle distribution and prepare files without installing
        shell: pwsh
        run: |
          $work=Join-Path $env:RUNNER_TEMP 'manager-oracle'
          ./scripts/inspect_oracle.ps1 -WorkDirectory $work
          $root=Join-Path $env:RUNNER_TEMP 'Portable Manager Тест'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          python -X utf8 scripts/prepare_app64.py (Join-Path $work 'VirtualBox-7.2.22-175245-Win.exe') (Join-Path $root 'app64') --sha256 afd0ff1656cbe04ed88ce619594ae021419d97cce89fa9bdc443e9a963f1713f --version 7.2.22
          if ($LASTEXITCODE -ne 0) { throw 'File preparation failed' }
          "MANAGER_ROOT=$root" >> $env:GITHUB_ENV
      - name: Compile ordinary public frontend with official signed AutoIt
        shell: pwsh
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'manager-autoit.zip'
          Invoke-WebRequest -Uri 'https://www.autoitscript.com/autoit3/files/archive/autoit/autoit-v3.3.18.0.zip' -OutFile $archive
          $target=Join-Path $env:RUNNER_TEMP 'manager-autoit'
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          $bins=@(Get-ChildItem -LiteralPath $target -Recurse -File -Filter Aut2exe_x64.exe)
          if ($bins.Count -ne 1) { throw 'Ambiguous compiler' }
          $sig=Get-AuthenticodeSignature -LiteralPath $bins[0].FullName
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'AutoIt') { throw 'Untrusted compiler' }
          $toolchain=Split-Path (Split-Path $bins[0].FullName -Parent) -Parent
          ./scripts/build.ps1 -AutoItRoot $toolchain
          $exe=(Resolve-Path 'build/Portable-VirtualBox_x64.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList '--version' -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw 'Read-only public version probe failed' }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $env:MANAGER_ROOT 'Portable-VirtualBox.exe')
      - name: Download exact official Alpine guest ISO for disposable VM only
        shell: pwsh
        run: |
          # ISO is guest input, NOT a trusted driver/system executable.
          # Verify an exact version against the official HTTPS checksum.
          $name='alpine-virt-3.24.3-x86_64.iso'
          $base='https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/'
          $iso=Join-Path $env:RUNNER_TEMP $name
          $sum=Join-Path $env:RUNNER_TEMP ($name+'.sha256')
          Invoke-WebRequest -Uri ($base+$name+'.sha256') -OutFile $sum -ErrorAction Stop
          $manifest=(Get-Content -LiteralPath $sum -Raw -Encoding utf8).Trim()
          if ($manifest -notmatch ('(?i)^([0-9a-f]{64})\s+\*?'+[regex]::Escape($name)+'$')) {
            throw 'Official Alpine manifest does not identify the exact ISO'
          }
          $expected=$Matches[1].ToLowerInvariant()
          Invoke-WebRequest -Uri ($base+$name) -OutFile $iso -ErrorAction Stop
          if ((Get-FileHash -LiteralPath $iso -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Official Alpine ISO SHA256 mismatch'
          }
          "MANAGER_GUEST_ISO=$iso" >> $env:GITHUB_ENV
          "MANAGER_GUEST_SHA=$expected" >> $env:GITHUB_ENV
      - name: Exercise real buttons, Alpine guest display, VDI, snapshot and two-cycle cleanup
        shell: pwsh
        run: |
          try {
            ./scripts/check_manager_session_gui.ps1 -PortableRoot $env:MANAGER_ROOT -MainLauncher -GuestIso $env:MANAGER_GUEST_ISO -GuestIsoSha256 $env:MANAGER_GUEST_SHA
          } catch {
            # Capture before the step's process tree is released by the runner.
            ./scripts/snapshot_manager_windows.ps1 -PortableRoot $env:MANAGER_ROOT
            throw
          }
      - name: Collect bounded evidence only, no executable or Oracle payload
        if: always()
        shell: pwsh
        run: |
          $dest='results/manager-session'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $proof=Join-Path $env:RUNNER_TEMP 'manager-gui-proof'
          if (Test-Path -LiteralPath $proof) {
            Get-ChildItem -LiteralPath $proof -File | Where-Object { $_.Extension -in @('.txt','.json','.png') -and $_.Length -lt 2097152 } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dest }
          }
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'pvbox-manager-*' | ForEach-Object {
            $folder=$_
            $target=Join-Path $dest $folder.Name
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            foreach ($relative in @('session.json','quiescent-session.json','error-Prepare.txt','error-Finish.txt','machinefolder.stderr.txt','stage/sup-standalone.json','start/sup-start-results.json','cleanup/cleanup-results.json')) {
              $path=Join-Path $folder.FullName $relative
              if (Test-Path -LiteralPath $path -PathType Leaf) { Copy-Item -LiteralPath $path -Destination $target }
            }
          }
      - name: Upload evidence, not runnable experimental distribution
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: manager-gui-session-evidence
          path: results/manager-session/
          retention-days: 7
          if-no-files-found: warn
