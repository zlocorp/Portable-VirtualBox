name: Verified Oracle package preparation (no installation)
on:
  push:
    branches: [dev/modernization-2026]
    paths:
      - .github/workflows/inspect-oracle.yml
      - scripts/inspect_oracle.ps1
      - scripts/oracle_extract.py
      - scripts/pe_resources.py
      - scripts/oracle_release.py
      - scripts/safe_files.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Python regression suite on Windows
        shell: pwsh
        run: |
          python -X utf8 -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: Diagnose official public manifest format
        shell: pwsh
        run: |
          python -c "import urllib.request; d=urllib.request.urlopen('https://download.virtualbox.org/virtualbox/7.2.20/SHA256SUMS',timeout=30).read(131073); print(repr(d[:8000]))"
          if ($LASTEXITCODE -ne 0) { throw 'Manifest format probe failed' }
      - name: Download, verify, passively extract and inspect MSI
        shell: pwsh
        run: ./scripts/inspect_oracle.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'verified-oracle-inspection')
      - name: Retain metadata only, not Oracle payloads
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oracle-package-inspection
          path: .reports/oracle-inspection.json
          if-no-files-found: warn
          retention-days: 7
